<!doctype html><meta charset="utf-8"><title>YouTube</title>
<!-- Gia lap trang xem video. Cau truc theo HTML that (html/yt-10-watch.html): like-button-view-model button
     (aria-label "cùng N người khác thích video này", aria-pressed), ytd-comments, yt-formatted-string#simplebox-placeholder
     "Thêm bình luận...", #contenteditable-root, ytd-button-renderer#submit-button > button[aria-label=Bình luận],
     ytd-comment-thread-renderer > ytd-comment-view-model (#pinned-comment-badge luon co, chi co chu khi da ghim;
     yt-attributed-string#content-text; nut button[aria-label="Menu tác vụ"]), menu ytd-popup-container >
     ytd-menu-popup-renderer[role=menu] > tp-yt-paper-item[role=menuitem]. Hop thoai xac nhan ghim va thong bao:
     chua co HTML that (gia: tp-yt-paper-dialog[role=dialog] + yt-confirm-dialog-renderer, tp-yt-paper-toast).
     Binh luan chi tai khi cuon xuong. localStorage 'opt-nopin' = '1': menu khong co "Ghim". -->
<style>
  body { margin: 0; font: 14px Roboto, Arial, sans-serif; background: #0f0f0f; color: #f1f1f1 }
  ytd-comments, ytd-comment-thread-renderer, ytd-comment-view-model, ytd-comment-simplebox-renderer, ytd-commentbox, ytd-popup-container,
  ytd-menu-popup-renderer, tp-yt-paper-listbox, yt-confirm-dialog-renderer, yt-attributed-string { display: block }
  like-button-view-model, dislike-button-view-model, ytd-button-renderer, yt-button-shape, ytd-menu-renderer, yt-icon-button { display: inline-block }
  header { height: 56px; display: flex; align-items: center; padding: 0 16px; gap: 16px }
  main { display: grid; grid-template-columns: 860px 360px; gap: 24px; padding: 0 24px }
  .player { height: 480px; background: #222 }
  h1 { font-size: 20px }
  .bar { display: flex; align-items: center; gap: 12px }
  button { background: #272727; color: #f1f1f1; border: 0; border-radius: 18px; padding: 8px 14px; cursor: pointer }
  button[aria-pressed=true] { background: #f1f1f1; color: #0f0f0f }
  button[disabled] { opacity: .4 }
  .side div { height: 120px; background: #222; margin-bottom: 8px }
  #simplebox-placeholder { display: block; border-bottom: 1px solid #555; padding: 6px 0; color: #aaa; cursor: text }
  #contenteditable-root { border-bottom: 2px solid #fff; padding: 6px 0; min-height: 20px }
  ytd-comment-thread-renderer { margin: 16px 0; position: relative }
  #author-text { background: #333; border-radius: 10px; padding: 1px 6px; font-size: 12px; color: #fff; text-decoration: none }
  #action-menu { position: absolute; right: 0; top: 0 }
  ytd-popup-container tp-yt-iron-dropdown { position: fixed; z-index: 10; background: #282828; border-radius: 8px; padding: 8px 0 }
  tp-yt-paper-item { display: block; padding: 8px 24px; cursor: pointer }
  .bg { position: fixed; inset: 0; background: #0008; z-index: 20 }
  tp-yt-paper-dialog { position: fixed; left: 440px; top: 330px; width: 380px; background: #212121; padding: 16px; border-radius: 12px; z-index: 30; display: block }
  tp-yt-paper-toast { position: fixed; left: 12px; bottom: 24px; background: #f1f1f1; color: #0f0f0f; padding: 12px 16px; border-radius: 6px; z-index: 40 }
  tp-yt-paper-toast[hidden] { display: none }
</style>
<script src="/__file/optimize/data.js"></script>
<header><b>▶ YouTube</b><input placeholder="Tìm kiếm" style="width:480px"></header>
<main>
  <div>
    <div class="player"></div>
    <h1><span id="video-title"></span></h1>
    <div class="bar"><b>Dark Bible Study</b><button>Số liệu phân tích</button><button>Chỉnh sửa video</button><span style="flex:1"></span>
      <like-button-view-model><toggle-button-view-model><button-view-model><button id="like" aria-pressed="false"></button></button-view-model></toggle-button-view-model></like-button-view-model>
      <dislike-button-view-model><button aria-pressed="false" aria-label="Không thích video này">👎</button></dislike-button-view-model><button>Chia sẻ</button></div>
    <p class="desc"></p>
    <ytd-comments id="comments" style="min-height:900px"></ytd-comments>
  </div>
  <div class="side"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
</main>
<ytd-popup-container id="popups"></ytd-popup-container>
<tp-yt-paper-toast id="toast" hidden><span id="text-container"></span></tp-yt-paper-toast>
<script>
const id = new URLSearchParams(location.search).get('v')
const video = OPT.videoOf(id)
const CK = 'opt-comments-' + id, LK = 'opt-like-' + id
const me = OPT.channel.handle
let comments = OPT.load(CK, [])
let liked = OPT.load(LK, false)
const $ = (s, r = document) => r.querySelector(s)
const esc = OPT.esc
$('#video-title').textContent = video.title
$('.desc').textContent = `${video.views} lượt xem · ${video.title}`

function paintLike() {
  const b = $('#like')
  b.setAttribute('aria-pressed', String(liked))
  b.setAttribute('aria-label', `cùng 2 người khác thích video này`)
  b.textContent = `👍 ${2 + (liked ? 1 : 0)}`
}
$('#like').onclick = () => { liked = !liked; OPT.save(LK, liked); OPT.log({ type: 'like', id, liked }); paintLike() }
paintLike()

function toast(text) {
  const t = $('#toast')
  $('#text-container', t).textContent = text
  t.hidden = false
  setTimeout(() => { t.hidden = true }, 3000)
}
const closePopups = () => { $('#popups').innerHTML = '' }

function renderComments() {
  const box = $('#comments')
  const list = [...comments].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0))
  box.innerHTML = `<div class="bar"><b>${comments.length} bình luận</b><span>Sắp xếp theo</span></div>
    <ytd-comment-simplebox-renderer><div id="placeholder-area"><yt-formatted-string id="simplebox-placeholder" role="textbox">Thêm bình luận...</yt-formatted-string></div><div id="comment-dialog"></div></ytd-comment-simplebox-renderer>` +
    list.map((c) => `<ytd-comment-thread-renderer data-i="${comments.indexOf(c)}"><div id="comment-container"><ytd-comment-view-model id="comment"><div id="body"><div id="main">
      <div id="header"><div id="pinned-comment-badge">${c.pinned ? `<ytd-pinned-comment-badge-renderer>📌 Đã ghim bởi ${esc(me)}</ytd-pinned-comment-badge-renderer>` : ''}</div>
        <div id="header-author"><h3><a id="author-text" href="/${esc(c.author)}"><span>${esc(c.author)}</span></a></h3><span id="published-time-text"><a>${c.at || '1 ngày trước'}</a></span></div></div>
      <yt-attributed-string id="content-text"><span role="text">${esc(c.text)}</span></yt-attributed-string>
      <div id="toolbar"><button aria-pressed="false" aria-label="Thích bình luận này">👍</button><button>Phản hồi</button></div></div>
      <div id="action-menu"><ytd-menu-renderer><yt-icon-button id="button" class="dropdown-trigger"><button id="button" aria-label="Menu tác vụ">⋮</button></yt-icon-button></ytd-menu-renderer></div>
      </div></ytd-comment-view-model></div></ytd-comment-thread-renderer>`).join('')
  $('#simplebox-placeholder').onclick = openBox
  for (const t of box.querySelectorAll('ytd-comment-thread-renderer')) t.querySelector('#action-menu button').onclick = (e) => { e.stopPropagation(); menu(t, +t.dataset.i) }
}

function openBox() {
  $('#placeholder-area').hidden = true
  $('#comment-dialog').innerHTML = `<ytd-commentbox><div id="contenteditable-root" contenteditable="true" aria-label="Thêm bình luận..."></div>
    <div class="bar" style="justify-content:flex-end"><ytd-button-renderer id="cancel-button"><yt-button-shape><button aria-label="Hủy">Hủy</button></yt-button-shape></ytd-button-renderer>
    <ytd-button-renderer id="submit-button"><yt-button-shape><button aria-label="Bình luận" disabled="true" aria-disabled="true"><span role="text">Bình luận</span></button></yt-button-shape></ytd-button-renderer></div></ytd-commentbox>`
  const ed = $('#contenteditable-root')
  const sb = $('#submit-button button')
  ed.focus()
  ed.addEventListener('input', () => { const off = !ed.innerText.trim(); sb.setAttribute('aria-disabled', String(off)); if (off) sb.setAttribute('disabled', 'true'); else sb.removeAttribute('disabled') })
  $('#cancel-button').onclick = renderComments
  sb.onclick = () => {
    if (sb.hasAttribute('disabled')) return
    const text = ed.innerText.trim()
    sb.setAttribute('disabled', 'true')
    setTimeout(() => {
      comments.unshift({ author: me, text, at: '0 giây trước', pinned: false })
      OPT.save(CK, comments)
      OPT.log({ type: 'comment', id, text })
      renderComments()
    }, 800) // binh luan hien tre
  }
}

function menu(thread, i) {
  closePopups()
  const r = thread.querySelector('#action-menu button').getBoundingClientRect()
  const items = (OPT.load('opt-nopin', false) ? [] : [comments[i].pinned ? 'Bỏ ghim' : 'Ghim']).concat(['Chỉnh sửa', 'Xóa'])
  setTimeout(() => {
    $('#popups').innerHTML = `<tp-yt-iron-dropdown style="left:${r.left - 140}px;top:${r.bottom + 4}px"><div id="contentWrapper"><ytd-menu-popup-renderer role="menu"><tp-yt-paper-listbox id="items" role="none">
      ${items.map((x) => `<ytd-menu-navigation-item-renderer role="menuitem"><tp-yt-paper-item role="menuitem"><yt-formatted-string>${x}</yt-formatted-string></tp-yt-paper-item></ytd-menu-navigation-item-renderer>`).join('')}
      </tp-yt-paper-listbox></ytd-menu-popup-renderer></div></tp-yt-iron-dropdown>`
    $('#popups').onclick = (e) => {
      const t = e.target.closest('tp-yt-paper-item')
      if (!t) return
      e.stopPropagation()
      closePopups()
      if (t.textContent.trim() === 'Ghim') confirmPin(i)
    }
  }, 200)
}

function confirmPin(i) {
  setTimeout(() => {
    $('#popups').innerHTML = `<div class="bg"></div><tp-yt-paper-dialog role="dialog"><yt-confirm-dialog-renderer><h3 id="title">Ghim bình luận này?</h3>
      <p>Nếu bạn đã ghim một bình luận, thì bình luận này sẽ thay thế bình luận đã ghim trước đó.</p>
      <div class="bar" style="justify-content:flex-end"><yt-button-renderer id="cancel-button"><button aria-label="Hủy">Hủy</button></yt-button-renderer><yt-button-renderer id="confirm-button"><button aria-label="Ghim">Ghim</button></yt-button-renderer></div></yt-confirm-dialog-renderer></tp-yt-paper-dialog>`
    $('#popups #cancel-button').onclick = closePopups
    $('#popups .bg').onclick = closePopups
    $('#popups #confirm-button').onclick = () => {
      closePopups()
      comments.forEach((c, k) => { c.pinned = k === i })
      OPT.save(CK, comments)
      OPT.log({ type: 'pin', id, text: comments[i].text })
      renderComments()
      toast('Đã ghim bình luận')
    }
  }, 200)
}

document.addEventListener('click', (e) => { if (!e.target.closest('#popups')) closePopups() })
// phan binh luan chi tai khi cuon xuong (giong YouTube that)
let loaded = false
addEventListener('scroll', () => {
  if (loaded || scrollY < 150) return
  loaded = true
  setTimeout(renderComments, 400)
})
</script>
